---
- name: Install OpenJDK
  apt:
    name: openjdk-17-jdk
    state: present
    update_cache: true

- name: Create tomcat group
  group:
    name: tomcat
    state: present

- name: Create tomcat system user
  user:
    name: tomcat
    group: tomcat
    home: /usr/local/tomcat
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Download Tomcat
  get_url:
    url: "https://archive.apache.org/dist/tomcat/tomcat-10/v{{ tomcat_version }}/bin/apache-tomcat-{{ tomcat_version }}.tar.gz"
    dest: "/tmp/apache-tomcat-{{ tomcat_version }}.tar.gz"

- name: Extract Tomcat to /usr/local
  unarchive:
    src: "/tmp/apache-tomcat-{{ tomcat_version }}.tar.gz"
    dest: /usr/local/
    remote_src: true
    creates: "/usr/local/apache-tomcat-{{ tomcat_version }}"

- name: Symlink /usr/local/tomcat to the versioned folder
  file:
    src: "/usr/local/apache-tomcat-{{ tomcat_version }}"
    dest: /usr/local/tomcat
    state: link

- name: Fix ownership of Tomcat directory
  file:
    path: "/usr/local/apache-tomcat-{{ tomcat_version }}"
    owner: tomcat
    group: tomcat
    recurse: true

- name: Deploy systemd unit for Tomcat
  template:
    src: tomcat.service.j2
    dest: /etc/systemd/system/tomcat.service
    mode: "0644"
  notify: restart tomcat

- name: Deploy WAR artifact (optional — only if a build was provided)
  copy:
    src: "{{ war_file_path }}"
    dest: /usr/local/tomcat/webapps/ROOT.war
    owner: tomcat
    group: tomcat
  when: war_file_path is defined
  notify: restart tomcat

- name: Enable and start Tomcat
  systemd:
    name: tomcat
    enabled: true
    state: started
    daemon_reload: true
