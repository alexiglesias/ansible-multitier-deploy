---
- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: true

- name: Deploy reverse-proxy site config
  template:
    src: vprofile.conf.j2
    dest: /etc/nginx/sites-available/vprofile.conf
    mode: "0644"
  notify: reload nginx

- name: Enable the vprofile site
  file:
    src: /etc/nginx/sites-available/vprofile.conf
    dest: /etc/nginx/sites-enabled/vprofile.conf
    state: link
  notify: reload nginx

- name: Remove the default Nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Ensure Nginx is running and enabled
  service:
    name: nginx
    state: started
    enabled: true
