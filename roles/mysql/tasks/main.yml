---
- name: Install MySQL server and Python connector
  apt:
    name:
      - mysql-server
      - python3-pymysql
    state: present
    update_cache: true

- name: Ensure MySQL is running and enabled
  service:
    name: mysql
    state: started
    enabled: true

- name: Set the MySQL root password
  community.mysql.mysql_user:
    name: root
    password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    state: present

- name: Create the application database
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"

- name: Create the application database user
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    priv: "{{ db_name }}.*:ALL"
    host: "%"
    login_user: root
    login_password: "{{ mysql_root_password }}"
    state: present

- name: Allow remote connections (bind-address)
  lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: '^bind-address'
    line: 'bind-address = 0.0.0.0'
  notify: restart mysql

- name: Import initial database dump (idempotent — only if table count is 0)
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: import
    target: "{{ db_backup_path }}"
    login_user: root
    login_password: "{{ mysql_root_password }}"
  when: import_db_backup | default(false)
