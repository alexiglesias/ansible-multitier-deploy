---
# Template for vars/secrets.yml — copy it and set your own values:
#   cp vars/secrets.example.yml vars/secrets.yml
#
# vars/secrets.yml is git-ignored. Optionally encrypt it locally:
#   ansible-vault encrypt vars/secrets.yml
#
# Used by the mysql role (db01).

# Password for the MySQL root account
mysql_root_password: "CHANGE_ME_root_password"

# Password for the application user (db_user in roles/mysql/vars/main.yml)
db_password: "CHANGE_ME_app_password"
